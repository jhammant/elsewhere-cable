AWSTemplateFormatVersion: "2010-09-09"
Description: HTTPS redirect from the Elsewhere Cable domain to the stable YouTube live endpoint.

Parameters:
  DomainName:
    Type: String
    Default: elsewherecable.hammant.io
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  DestinationUrl:
    Type: String
    Default: https://www.youtube.com/@jhammant/live

Resources:
  RedirectCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: elsewhere-cable

  LiveRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: elsewhere-cable-live-redirect
      AutoPublish: true
      FunctionConfig:
        Comment: Redirect Elsewhere Cable viewers to the current YouTube live broadcast
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          return {
            statusCode: 302,
            statusDescription: 'Found',
            headers: {
              location: { value: '${DestinationUrl}' },
              'cache-control': { value: 'no-store, max-age=0' }
            }
          };
        }

  RedirectDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        Comment: Elsewhere Cable stable live-stream redirect
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: unused-youtube-origin
            DomainName: www.youtube.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: unused-youtube-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          DefaultTTL: 0
          MaxTTL: 0
          MinTTL: 0
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt LiveRedirectFunction.FunctionARN
        ViewerCertificate:
          AcmCertificateArn: !Ref RedirectCertificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: Project
          Value: elsewhere-cable

  RedirectIPv4Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt RedirectDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2

  RedirectIPv6Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt RedirectDistribution.DomainName
        EvaluateTargetHealth: false
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  PublicUrl:
    Description: Stable public URL for Elsewhere Cable
    Value: !Sub https://${DomainName}
  RedirectDestination:
    Description: Stable YouTube channel-level live endpoint
    Value: !Ref DestinationUrl
  CloudFrontDistributionId:
    Value: !Ref RedirectDistribution
